version: '3.8'

services:
  db:
    image: postgres:15
    container_name: nexus_db_container
    environment:
      POSTGRES_DB: nexus_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    volumes:
      # আপনার পিসির D:\DockerData ফোল্ডারে ডাটা সেভ হবে
      - D:/DockerData:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: nexus_backend_container
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgres://postgres:postgres123@db:5432/nexus_db

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: nexus_frontend_container
    ports:
      - "80:80"
    depends_on:
      - backend